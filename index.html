<script type="module">
/* ═══ PAINT CTF · a Multiplayer Agent starter ════════════════════════════════════════════
 * Two teams with paint blasters. Grab the other team's flag and bring it home. Versus,
 * 2–10 players in two teams; bots fill both teams.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ team size, captures to win, blaster, movement, bots, and the MAP itself
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ARENA ......... blocks, the paintable floor, the flag stands, built from MAP
 *   PHYSICS ....... walking, jumping and block collisions; ray tests
 *   FIGHTERS ...... the paint soldier model; everyone else drawn from state
 *   FLAGS ......... the two flags and their beacons, placed from the match state
 *   PAINT & FX .... paint balls, splats on the floor and walls, particles, sounds
 *   MATCH (HOST) .. teams, flags, captures, splats, timer, winner, restart. Only the host writes these.
 *   BOTS (HOST) ... attackers go for the flag, defenders guard home, everyone shoots. The host runs them.
 *   ME ............ moving, shooting, getting splatted. Each player writes only its own.
 *   HUD & RESULTS . score, flag status, kill feed, results card, leaderboard
 *   INPUT ......... pointer lock + WASD; on touch a move stick, drag to look, FIRE and JUMP
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, yaw, pitch,
 *     alive, health) about 15 times a second, `dth` {m, n, by} when it gets splatted
 *     (match id, splats so far, by whom), `rdy` (the match it pressed Play again on),
 *     `hb` (heartbeat) once a second, and `n`/`c` (name, color) once.
 *   - SHOTS ARE DECIDED BY THE SHOOTER. Your browser flies YOUR paint balls against what
 *     YOU see and, on a hit, sends "hit" {to, dmg, by}. The victim lowers its own health
 *     (only it writes its `p`); a hit on a bot goes to the host, which owns the bots.
 *     "shot" {o, v} lets everyone else fly the same ball, just for the look and the splat.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `match` (id, v, phase,
 *     endsAt, score, teams, both flags, points, kill feed, results) and `bots`.
 *   - FLAGS ARE HOST-RUN: the host checks every frame where everyone is (players' own `p`,
 *     its bots) and decides who took, dropped, returned or captured a flag. Nobody sends
 *     a "grab": walking onto the flag is enough. A new host adopts it all from `match`.
 *   - The host puts each new player in the team with fewer people (`match.tm`).
 *   - A new match starts only when the host bumps match.id; every client respawns and
 *     washes the floor.
 *   - ?attract plays offline with bots only and a chase camera (the preview video).
 *   - Leaderboard "ctf-points": your points in one match (capture 5, return 2, splat 1).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  teamSize: 4,          // bots fill each team up to this many players (4 v 4)
  capLimit: 3,          // first team to bring home this many flags wins
  matchMs: 300000,      // or the team with more captures when time runs out
  resultsMs: 12000,     // results card time before the next match
  respawnMs: 3000,      // time splatted before you come back at your stand
  shieldMs: 1500,       // nobody can paint you this long after you spawn
  hp: 100,
  dmg: 34,              // one paint ball; three splat you
  regenAfterMs: 3500,   // go this long without being hit and your health comes back ...
  regen: 30,            // ... this much per second
  fireMs: 170,          // time between shots while the trigger is held
  ballSpeed: 46,        // paint balls fly in a gentle arc
  ballGravity: 7,
  range: 55,
  spread: 0.012,        // aim wobble (radians)
  speed: 8,
  carrySlow: 0.85,      // speed multiplier while you carry a flag
  jump: 7.4, gravity: 20,
  look: 0.0022,         // mouse sensitivity (touch uses 2.6x)
  grabRadius: 1.6,      // how close you must get to take or return a flag
  capRadius: 2.4,       // how close to your own stand you must bring it
  flagReturnMs: 12000,  // a dropped flag flies home on its own after this
  botFireMs: 480,       // time between bot shots (a bit random)
  botAim: 0.07,         // bot aim error per unit of distance; lower = deadlier
  botSight: 28,         // how far bots spot an enemy
  botTurn: 6,           // how fast bots turn (radians/s)

const TEAMS = [{ name: "Orange", color: "#ff7a1a" }, { name: "Blue", color: "#2f86ff" }];
// The LEFT half of the arena (Orange's side), one character per 2x2 cell. The right half is
// this mirrored, with a→b and A→B, so both sides are always fair.
// # wall (4 high)  = low wall (2 high)  + crate (1 high, jump on it)  . floor
// A Orange's flag stand  a an Orange spawn point  (B and b on the mirrored side are Blue's)
const HALF_MAP = [
  "################",
  "#.a......+......",
  "#........+...=..",
  "#.==.........=..",
  "#.....#.........",
  "#.....#.....+...",
  "#a..........+...",
  "#.........=...++",
  "#..A......=...++",
  "#.........=...++",
  "#a..........+...",
  "#.....#.....+...",
  "#.....#.........",
  "#.==.........=..",
  "#........+...=..",
  "#.a......+......",
  "################",

const MAP = HALF_MAP.map((row) => row + [...row].reverse().join("").replace(/a/g, "b").replace(/A/g, "B"));
const BLOCKS = { "#": 4, "=": 2, "+": 1 };
const BOT_NAMES = ["Splotch", "Drip", "Blot", "Smudge", "Squirt", "Dab", "Speckle", "Swash", "Spritz", "Fleck"];
const COLORS = ["#ffd23f", "#4ee08a", "#ff5fa2", "#b26bff", "#2ee6d6", "#ffffff", "#ff4d4d", "#9dff3f"]; // personal colors: your paint tank

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'paint-ctf',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];

  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };

function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
const seenHb = new Map();

  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── ARENA ───────────────────────────────────────────────────────────────────────────
const CELL = 2, MW = MAP[0].length, MH = MAP.length, HEIGHT = [], SPAWNS = [[], []], STANDS = [], OPEN = [];
MAP.forEach((row, z) => [...row].forEach((ch, x) => {
  const i = z * MW + x, at = { x: (x + 0.5) * CELL, z: (z + 0.5) * CELL };
  HEIGHT[i] = BLOCKS[ch] || 0;
  if (!HEIGHT[i]) OPEN.push(at);
  if (ch === "a" || ch === "b") SPAWNS[ch === "a" ? 0 : 1].push(at);
  if (ch === "A" || ch === "B") STANDS[ch === "A" ? 0 : 1] = at;
}));
const AW = MW * CELL, AH = MH * CELL, MID = { x: AW / 2, z: AH / 2 };
const cellH = (cx, cz) => (cx < 0 || cz < 0 || cx >= MW || cz >= MH ? 99 : HEIGHT[cz * MW + cx]);
const heightAt = (x, z) => cellH(Math.floor(x / CELL), Math.floor(z / CELL));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false; // blocks never move: draw shadows once
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#bfe4ff");
scene.fog = new THREE.Fog("#bfe4ff", 50, 140);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 300);
let baseFov = 70;
function fit() { // a tall phone screen gets a wider view, so you still see to the sides
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camera.fov = baseFov = Math.min(88, (2 * Math.atan(Math.tan((70 * Math.PI) / 360) * Math.max(1, 1.25 / camera.aspect)) * 180) / Math.PI); camera.updateProjectionMatrix();
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#ffffff", "#9aa6d6", 2.0));
const sun = new THREE.DirectionalLight("#fff1d6", 1.7);
sun.position.set(MID.x + 18, 44, MID.z + 22); sun.target.position.set(MID.x, 0, MID.z); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 1024); sun.shadow.bias = -0.0008;
Object.assign(sun.shadow.camera, { left: -42, right: 42, top: 26, bottom: -26, near: 5, far: 110 });

function canvasTex(w, h, paint) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const seeded = mulberry32(5);
const blockTex = canvasTex(64, 64, (c) => {
  c.fillStyle = "#fff"; c.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 160; i++) { c.fillStyle = `rgba(0,0,0,${seeded() * 0.03})`; c.fillRect(seeded() * 64, seeded() * 64, 3, 3); }
  c.strokeStyle = "#0000002a"; c.lineWidth = 4; c.strokeRect(2, 2, 60, 60);
});
const crateTex = canvasTex(64, 64, (c) => {
  c.fillStyle = "#fff"; c.fillRect(0, 0, 64, 64); c.strokeStyle = "#0000003a"; c.lineWidth = 6; c.strokeRect(3, 3, 58, 58);
  c.beginPath(); c.moveTo(6, 58); c.lineTo(58, 6); c.stroke();
});
const cubes = [], crates = [];
MAP.forEach((row, z) => [...row].forEach((ch, x) => {
  if (ch === "+") crates.push({ x, z });
  else for (let k = 0; k < (BLOCKS[ch] || 0) / CELL; k++) cubes.push({ x, z, k, ch, side: x < MW / 2 ? 0 : 1 });
}));
/** The color of one wall cube: outer walls cream, pillars pale, low walls in their side's team color. */
function cubeColor(b) {
  const outer = !b.x || !b.z || b.x === MW - 1 || b.z === MH - 1;
  if (b.ch === "=") return b.side ? "#9cc4ff" : "#ffbe8a";
  return outer ? ((b.x + b.z + b.k) % 2 ? "#f6f2ea" : "#ece6da") : ((b.x + b.z + b.k) % 2 ? "#e6e8f3" : "#d8dcec");
}
const mtx = new THREE.Matrix4(), col = new THREE.Color();
const cubeMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(CELL, CELL, CELL), new THREE.MeshStandardMaterial({ map: blockTex, roughness: 0.9 }), cubes.length);
cubes.forEach((b, i) => { cubeMesh.setMatrixAt(i, mtx.makeTranslation((b.x + 0.5) * CELL, b.k * CELL + 1, (b.z + 0.5) * CELL)); cubeMesh.setColorAt(i, col.set(cubeColor(b)).offsetHSL(0, 0, (seeded() - 0.5) * 0.04)); });
const crateMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(CELL, 1, CELL), new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.8 }), crates.length);
crates.forEach((b, i) => { crateMesh.setMatrixAt(i, mtx.makeTranslation((b.x + 0.5) * CELL, 0.5, (b.z + 0.5) * CELL)); crateMesh.setColorAt(i, col.set("#ffc95a").offsetHSL(0, 0, (seeded() - 0.5) * 0.06)); });
for (const m of [cubeMesh, crateMesh]) { m.castShadow = m.receiveShadow = true; scene.add(m); }

// The floor is ONE canvas the paint gets drawn into (PX canvas pixels per world unit).
const PX = 16, paintCv = document.createElement("canvas");
paintCv.width = AW * PX; paintCv.height = AH * PX;
const paint = paintCv.getContext("2d"), floorTex = new THREE.CanvasTexture(paintCv);
floorTex.colorSpace = THREE.SRGBColorSpace; floorTex.anisotropy = 8;
let floorDirty = true, floorAt = 0;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.75 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(MID.x, 0, MID.z); floor.receiveShadow = true; scene.add(floor);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshBasicMaterial({ color: "#a9d98f" }));
ground.rotation.x = -Math.PI / 2; ground.position.set(MID.x, -0.05, MID.z); scene.add(ground);
/** A clean floor: tiles, the half-way line and a ring round each stand (where you bring the flag). */
function washFloor() {
  const c = paint; c.globalAlpha = 1;
  c.fillStyle = "#f4f0e8"; c.fillRect(0, 0, paintCv.width, paintCv.height);
  c.fillStyle = "#ebe6da";
  for (let z = 0; z < MH; z++) for (let x = 0; x < MW; x++) if ((x + z) % 2) c.fillRect(x * CELL * PX, z * CELL * PX, CELL * PX, CELL * PX);
  c.fillStyle = "#d9d2c3"; c.fillRect(AW * PX / 2 - 3, 0, 6, paintCv.height);
  for (const t of [0, 1]) {
    c.strokeStyle = TEAMS[t].color; c.lineWidth = 7; c.setLineDash([18, 10]);
    c.beginPath(); c.arc(STANDS[t].x * PX, STANDS[t].z * PX, CONFIG.capRadius * PX, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
  }
  floorDirty = true;
}
washFloor();
renderer.shadowMap.needsUpdate = true;

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
const R = 0.4, PH = 1.9, EYE = 1.6; // body radius, hit box height, eye height
/** Calls f(height) for every block cell under a body's footprint at (x, z). */
function footprint(x, z, f) {

}

/** Move a body (you or a bot) by (dx, dz) with gravity, jumping and block collisions. */

  const close = Math.hypot(aim.x - o.x, aim.y - o.y, aim.z - o.z) < 1.5;
  const v = launchVel(o, close ? { x: o.x + d.x * 20, y: o.y + d.y * 20, z: o.z + d.z * 20 } : aim, CONFIG.spread);
  launchBall(o, v, me.team, net.sessionId, true); sfx("shot");
  net.send("shot", { o: [o.x, o.y, o.z].map((n) => +n.toFixed(2)), v });
}
function hitMarker() { $("cross").classList.add("hit"); setTimeout(() => $("cross").classList.remove("hit"), 120); sfx("hit"); }
/** Route a hit to whoever owns the victim's health: me, the host (bots), or the victim's browser. */
function damage(to, dmg, by) {
  if (to === net.sessionId) hurtMe(dmg, by);
  else if (isHost() && host.bots.has(to)) hurtBot(to, dmg, by);
  else net.send("hit", { to, dmg, by });
}
function hurtMe(dmg, by) {
  const m = match(), now = performance.now();
  if (!me.alive || !m || m.phase !== "play" || now < me.shieldUntil || teamOf(by, m) === me.team) return;
  me.hp -= dmg; me.hitAt = now; sfx("hurt");
  const h = $("hurt"); h.style.background = `radial-gradient(circle, transparent 45%, ${TEAMS[1 - me.team].color} 140%)`;
  h.style.transition = "none"; h.style.opacity = 0.9; requestAnimationFrame(() => { h.style.transition = "opacity .5s"; h.style.opacity = 0; });
  if (me.hp > 0) return publish(true);
  me.alive = false; me.deaths++; me.killer = nameOf(by); me.killerId = by; me.respawnAt = now + CONFIG.respawnMs;
  me.dth = { m: m.id, n: me.deaths, by };
  net.me.set("dth", JSON.stringify(me.dth));
  splatFx(me.x, me.y, me.z, me.team);
  publish(true);
}
/** ?attract starts with paint already everywhere, so the first frame looks like a match in full swing. */
function prePaint() {
  const rnd = mulberry32(3);
  for (let i = 0; i < 170; i++) {
    const p = OPEN[Math.floor(rnd() * OPEN.length)], team = rnd() < p.x / AW ? 1 : 0;
    paint.fillStyle = TEAMS[team].color; paint.globalAlpha = 0.93; drawBlob(paint, (p.x + (rnd() - 0.5) * 2) * PX, (p.z + (rnd() - 0.5) * 2) * PX, (0.5 + rnd() * 1.1) * PX, rnd);
  }
  paint.globalAlpha = 1; floorDirty = true;
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}`;
const tname = (t, s) => `<span style="color:${t >= 0 ? TEAMS[t].color : "#fff"};-webkit-text-stroke:.3px #0006">${esc(s)}</span>`;
let board = null, boardFor = -1, joinedAt = 0, lastFeed = "", lastSc = null, lastFl = null, toastUntil = 0;
function flagLine(m, t) {
  const f = m.fl[t];
  return f.s === 0 ? "flag safe" : f.s === 1 ? `taken by ${esc(short(nameOf(f.by)))}` : `dropped · ${Math.max(0, Math.ceil((f.at - Date.now()) / 1000))}s`;
}
function toast(text, color) { $("toast").textContent = text; $("toast").style.color = color; $("toast").classList.add("on"); toastUntil = performance.now() + 1800; }
/** Effects for flag changes everyone sees in state: grabs, drops, returns, captures. */
function flagEvents(m) {
  if (lastSc && lastFl && lastSc.id === m.id) {
    for (const t of [0, 1]) {
      if (m.sc[t] > lastSc.sc[t]) { const s = STANDS[t]; burst(s.x, 2, s.z, TEAMS[t].color, 70, 10, true); burst(s.x, 2, s.z, "#ffd23f", 30, 9, false); sfx("cap"); toast(`${TEAMS[t].name} scores!`, TEAMS[t].color); }
      const was = lastFl[t].s, now = m.fl[t].s;
      if (was !== 1 && now === 1) { sfx("grab", flagSpot(m, t)); if (m.fl[t].by === net.sessionId) toast("You have the flag!", TEAMS[me.team]?.color || "#fff"); }
      if (was === 2 && now === 0 && m.sc[1 - t] === lastSc.sc[1 - t]) sfx("ret");
    }
  }
  lastSc = { id: m.id, sc: m.sc }; lastFl = m.fl;
}
function hud(m, now) {
  if (performance.now() > toastUntil) $("toast").classList.remove("on");
  const feed = m.feed.map(([k, a, ta, b, tb]) => `<div>${tname(ta, a)} ${k === "s" ? `<span style="opacity:.8">splatted</span> ${tname(tb, b)}` : k === "g" ? `took the ${tname(tb, TEAMS[tb].name)} flag` : k === "c" ? `captured the ${tname(tb, TEAMS[tb].name)} flag!` : "returned the flag"}</div>`).join("");
  if (feed !== lastFeed) $("feed").innerHTML = lastFeed = feed;
  if (ATTRACT) { for (const id of ["score", "mine", "hp", "msg", "help", "net", "cross", "feed"]) $(id).style.display = "none"; return; }
  $("score").innerHTML = [0, 1].map((t) => `<div class="team${m.fl[t].s ? " alert" : ""}" style="background:${TEAMS[t].color}"><b>${m.sc[t]}</b><small>⚑ ${flagLine(m, t)}</small></div>`).join(`<div class="clock">${clock(Math.max(0, (m.phase === "play" ? m.endsAt : 0) - Date.now()))}</div>`);
  const mine = pointsOf(m.st[net.sessionId]);
  $("mine").innerHTML = me.team >= 0 ? `<b>${mine}</b>points · ${tname(me.team, TEAMS[me.team].name)}<br><span style="opacity:.8">first to ${CONFIG.capLimit} flags</span>` : "";
  $("hp").innerHTML = me.alive ? `♥ ${Math.max(0, Math.round(me.hp))}<i><b style="width:${Math.max(0, me.hp)}%;background:${me.hp < 35 ? "#ff4d6d" : "#4ee08a"}"></b></i>` : "";
  $("cross").style.display = me.alive ? "" : "none";
  const enemy = me.team >= 0 ? 1 - me.team : 0, carrying = me.team >= 0 && m.fl[enemy].s === 1 && m.fl[enemy].by === net.sessionId;
  $("msg").innerHTML = m.phase !== "play" || !me.joined ? "" : me.team < 0 ? "Joining a team…" : !me.alive && me.killer ? `Splatted by ${esc(me.killer)} · back in ${Math.max(1, Math.ceil((me.respawnAt - now) / 1000))}`
    : carrying ? (m.fl[me.team].s === 0 ? "Run it home to your stand!" : "Your own flag is gone: get it back to score") : m.fl[me.team].s === 1 ? `${tname(enemy, TEAMS[enemy].name)} has your flag! Splat the carrier` : "";
  $("help").style.opacity = me.joined && now - joinedAt < 9000 ? 1 : 0;
  if (me.team >= 0) $("help").innerHTML = `Grab the ${tname(enemy, TEAMS[enemy].name + " ⚑")} flag and bring it to your stand<br><span style="opacity:.85">${touchUI ? "left thumb moves · drag to look · FIRE shoots" : "WASD move · Space jump · click to shoot"}</span>`;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the bots" : ""}`;
  $("start").hidden = m.phase !== "play" || (me.joined && (touchUI || locked || noLock));
  $("over").hidden = m.phase !== "over";
  if (m.phase === "over") {
    if (document.pointerLockElement) document.exitPointerLock();
    $("winner").innerHTML = m.win < 0 ? "Draw!" : m.win === me.team ? "Your team wins!" : `${tname(m.win, TEAMS[m.win].name)} wins!`;
    $("results").innerHTML = m.res.map(([id, name, t, p]) => `<li class="${id === net.sessionId ? "me" : ""}"><i style="background:${TEAMS[t] ? TEAMS[t].color : "#fff"}"></i>${esc(name)}<span>${p}</span></li>`).join("");
    const people = humans(), ready = people.filter((id) => (id === net.sessionId ? me.ready : (S.entities.players[id] || {}).rdy) === m.id).length;
    $("again").textContent = me.ready === m.id ? `Ready (${ready}/${people.length})` : "Play again";
    $("next").textContent = `${TEAMS[0].name} ${m.sc[0]} – ${m.sc[1]} ${TEAMS[1].name} · next match in ${Math.max(0, Math.ceil((m.endsAt - Date.now()) / 1000))}s`;
    if (boardFor !== m.id) { boardFor = m.id; showBoard(m); }
  }
}
function showBoard(m) {
  const list = $("board"), mine = pointsOf(m.st[net.sessionId]);
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (mine > 0 && me.submitted !== m.id ? board.submit(mine).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No points yet. Score the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
  me.submitted = m.id;
}
$("again").onclick = () => { const m = match(); if (m && m.phase === "over") { me.ready = m.id; net.me.set("rdy", m.id); } };

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT, cv = renderer.domElement;
let locked = false, noLock = false;
$("touch").hidden = !touchUI; $("limit").textContent = CONFIG.capLimit;
if (touchUI) { $("how").textContent = "Left thumb moves · drag to look · FIRE shoots"; $("play").textContent = "Tap to play"; }
function look(dx, dy, k) { me.yaw -= dx * k; me.pitch = Math.max(-1.1, Math.min(1.1, me.pitch - dy * k)); }
const KEYS = { KeyW: "fwd", ArrowUp: "fwd", KeyS: "back", ArrowDown: "back", KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right", Space: "jump" };
addEventListener("keydown", (e) => { const k = KEYS[e.code]; if (k) { e.preventDefault(); input[k] = k === "jump" ? true : 1; } });
addEventListener("keyup", (e) => { const k = KEYS[e.code]; if (k) input[k] = k === "jump" ? false : 0; });
addEventListener("blur", () => Object.assign(input, { fwd: 0, back: 0, left: 0, right: 0, jump: false, fire: false }));
$("play").onclick = () => {
  if (!me.joined) { me.joined = true; joinedAt = performance.now(); }
  unlockAudio(); if (touchUI) return;
  try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => { noLock = true; }); } catch { noLock = true; } };
document.addEventListener("pointerlockchange", () => { locked = document.pointerLockElement === cv; if (!locked) input.fire = false; });
document.addEventListener("pointerlockerror", () => { noLock = true; }); // no pointer lock here: drag with the mouse to look
addEventListener("mousemove", (e) => { if (locked || (noLock && e.buttons)) look(e.movementX, e.movementY, CONFIG.look); });
cv.addEventListener("mousedown", (e) => { if (e.button === 0 && (locked || noLock)) input.fire = true; });
addEventListener("mouseup", () => { input.fire = false; });
// Touch: a floating stick on the left, drag anywhere else to look; FIRE can be dragged to aim while shooting.
const touch = { stick: null, look: null, ox: 0, oy: 0, lx: 0, ly: 0 };
cv.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  e.preventDefault(); unlockAudio();
  if (e.clientX < innerWidth * 0.45 && touch.stick === null) { Object.assign(touch, { stick: e.pointerId, ox: e.clientX, oy: e.clientY }); Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false; }
  else if (touch.look === null) Object.assign(touch, { look: e.pointerId, lx: e.clientX, ly: e.clientY });
});
addEventListener("pointermove", (e) => {
  if (e.pointerId === touch.stick) {
    const dx = e.clientX - touch.ox, dy = e.clientY - touch.oy, d = Math.min(45, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    input.sx = (Math.cos(a) * d) / 45; input.sy = -(Math.sin(a) * d) / 45;
    $("stick").firstChild.style.transform = `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
  } else if (e.pointerId === touch.look) { look(e.clientX - touch.lx, e.clientY - touch.ly, CONFIG.look * 2.6); touch.lx = e.clientX; touch.ly = e.clientY; }
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerId === touch.stick) { touch.stick = null; input.sx = input.sy = 0; $("stick").hidden = true; $("stick").firstChild.style.transform = ""; }
  if (e.pointerId === touch.look) touch.look = null;
});
for (const [id, key] of [["fire", "fire"], ["jump", "jump"]]) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); input[key] = true; b.classList.add("on"); if (id === "fire" && touch.look === null) Object.assign(touch, { look: e.pointerId, lx: e.clientX, ly: e.clientY }); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { input[key] = false; b.classList.remove("on"); });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const camDir = new THREE.Vector3(0, 0, 1);
const fly = { pos: new THREE.Vector3(MID.x, 26, MID.z + 26), look: new THREE.Vector3(MID.x, 0, MID.z), focus: null, focusAt: 0, yaw: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const m = match();
  if (m) {
    myTick(dt, m, now);
    syncViews(m, dt);
    flagEvents(m);
    drawFlags(m, now);
  }
  tickBalls(dt, fighters());
  tickEffects(dt);
  drawMe(dt);
  if (ATTRACT || !me.joined || me.team < 0) attractCamera(dt, now, m); // the preview, and behind the start card
  else if (me.alive) thirdPerson();
  else { // splatted: rise up and watch whoever got you
    const k = views.get(me.killerId), want = new THREE.Vector3(me.x, me.y + 7, me.z + 0.01);
    camera.position.lerp(want, 1 - Math.exp(-dt * 3)); camera.lookAt(k ? k.x : me.x, k ? k.y + 1 : me.y, k ? k.z : me.z);
  }
  const fov = ATTRACT || !me.joined ? baseFov * 0.85 : baseFov;
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  if (m && now - lastHud > 100) { lastHud = now; hud(m, now); }
}
/** My own soldier, drawn straight from my state (no easing). */
function drawMe(dt) {
  const accent = myColor;
  if (me.model && (me.model.team !== me.team || me.model.accent !== accent)) { scene.remove(me.model.g); me.model = null; }
  if (!me.model) me.model = makeFighter(me.team, accent, "");
  me.model.g.visible = me.alive;
  me.recoil = Math.max(0, me.recoil - dt * 9);
  if (me.alive) { pose(me.model, me, me.speed || 0, dt); me.model.arm.position.z = 0.06 - me.recoil * 0.08; }
}
/** Over the right shoulder. The crosshair is the middle of this camera, so shots aim from here. */
function thirdPerson() {
  const d = dirOf(me.yaw, me.pitch), rx = -Math.cos(me.yaw), rz = Math.sin(me.yaw), head = { x: me.x, y: me.y + 1.95, z: me.z };
  const tall = camera.aspect < 1, far = tall ? 6.5 : 5; // a phone held upright sits farther back, so you don't fill the screen
  const side = Math.max(0, Math.min(tall ? 0.6 : 0.95, rayWall(head, { x: rx, y: 0, z: rz }, 1.3) - 0.35)); // a wall on the right pulls the shoulder in
  const pivot = { x: head.x + rx * side, y: head.y, z: head.z + rz * side };
  const back = { x: -d.x, y: -d.y + (tall ? 0.4 : 0.3), z: -d.z }, bl = Math.hypot(back.x, back.y, back.z);
  const room = Math.max(0.4, Math.min(far, rayWall(pivot, { x: back.x / bl, y: back.y / bl, z: back.z / bl }, far) - 0.3)); // a wall behind pulls the camera in
  camera.position.set(pivot.x + (back.x / bl) * room, pivot.y + (back.y / bl) * room, pivot.z + (back.z / bl) * room);
  camDir.set(d.x, d.y, d.z);
  camera.lookAt(camera.position.x + d.x, camera.position.y + d.y, camera.position.z + d.z);
  if (me.model) me.model.g.visible = me.alive && room > 1.3; // squeezed against a wall: don't fill the screen with your own back
}
/** ?attract (and behind the start card): frames a fighter and its nearest enemy from the side
 *  (the flag carrier first), or chases it from behind when nobody is near. */
function attractCamera(dt, now, m) {
  const alive = [...views.values()].filter((v) => v.alive);
  if (!alive.length) { camera.position.copy(fly.pos); camera.lookAt(fly.look); return; }
  const foeOf = (v) => alive.filter((o) => o.team !== v.team).sort((p, q) => Math.hypot(p.x - v.x, p.z - v.z) - Math.hypot(q.x - v.x, q.z - v.z))[0];
  if (now > fly.focusAt || !views.get(fly.focus)?.alive) {
    const carrier = m && m.fl.map((f) => f.s === 1 && views.get(f.by)).find((v) => v && v.alive);
    const busy = alive.filter((v) => now - v.shotAt < 1200 && foeOf(v) && Math.hypot(foeOf(v).x - v.x, foeOf(v).z - v.z) < 16);
    fly.focus = (carrier && Math.random() < 0.5 ? carrier : busy[Math.floor(Math.random() * busy.length)] || carrier || alive[0]).id;
    fly.focusAt = now + 3500;
  }
  const v = views.get(fly.focus) || alive[0], q = foeOf(v), gap = q ? Math.hypot(q.x - v.x, q.z - v.z) : 99, near = gap < 16;
  const look = near ? { x: (v.x + q.x) / 2, y: v.y + 1, z: (v.z + q.z) / 2 } : { x: v.x + Math.sin(v.yaw) * 3, y: v.y + 1, z: v.z + Math.cos(v.yaw) * 3 };
  let base = near ? Math.atan2(q.x - v.x, q.z - v.z) + Math.PI / 2 : v.yaw + Math.PI; // side-on to the fight, or behind
  if (near && Math.abs(angleDiff(base + Math.PI, fly.yaw)) < Math.abs(angleDiff(base, fly.yaw))) base += Math.PI; // whichever side is nearer
  fly.yaw += angleDiff(base, fly.yaw) * (1 - Math.exp(-dt * 1.2));
  const dist = 6.5 + (near ? gap * 0.4 : 0), inside = (n, max) => Math.max(3, Math.min(max - 3, n)); // stay inside the walls
  const want = { x: inside(look.x + Math.sin(fly.yaw) * dist, AW), y: look.y + 5 + dist * 0.35, z: inside(look.z + Math.cos(fly.yaw) * dist, AH) };
  fly.pos.lerp(new THREE.Vector3(want.x, want.y, want.z), 1 - Math.exp(-dt * 2)); fly.look.lerp(new THREE.Vector3(look.x, look.y, look.z), 1 - Math.exp(-dt * 3));
  camera.position.copy(fly.pos); camera.lookAt(fly.look);
  camDir.set(fly.look.x - fly.pos.x, fly.look.y - fly.pos.y, fly.look.z - fly.pos.z).normalize();
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("shot", (msg, from) => {
    if (!msg || !Array.isArray(msg.o) || !Array.isArray(msg.v)) return;
    const v = views.get(from); if (!v) return;
    v.shotAt = performance.now(); launchBall({ x: msg.o[0], y: msg.o[1], z: msg.o[2] }, msg.v.map(Number), v.team, from, false); sfx("shot", v);
  });
  net.on("hit", (msg, from) => {
    if (!msg) return;
    const dmg = Math.min(CONFIG.dmg, Math.max(0, +msg.dmg || 0)), by = msg.by || from;
    if (msg.to === net.sessionId) hurtMe(dmg, by); else if (isHost() && host.bots.has(msg.to)) hurtBot(msg.to, dmg, by);
  });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { $("net").textContent = ""; Object.assign(CONFIG, { capLimit: 99, matchMs: 9e6, respawnMs: 1400, botFireMs: 360, botAim: 0.05, botSight: 34 }); }
  requestAnimationFrame(frame);
})();
</script>
